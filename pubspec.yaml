name: harf_ba_harf
description: "Urdu transcription and diarization"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  firebase_storage: ^12.4.5
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.3.0
  intl: ^0.20.2
  provider: ^6.1.5
  file_picker: ^10.1.2
  http: ^1.3.0
  fluttertoast: ^8.2.4
  firebase_remote_config: ^5.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoNastaliq
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Medium.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-SemiBold.ttf
